# Include inside the existing www.kamala.pro server block.
location = /telemetry-pendulum/state.json {
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}

# Named temporary snapshots are not public endpoints.
location ~ ^/telemetry-pendulum/\. {
    deny all;
}
