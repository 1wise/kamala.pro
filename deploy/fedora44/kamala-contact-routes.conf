# Include inside the existing www.kamala.pro HTTPS server block.
# Keep the indexed contact URL exact and preserve the existing PHP endpoint.
location = /kamala {
    try_files /kamala/index.html =404;
}
location = /kamala/ {
    return 301 /kamala$is_args$args;
}
location = /kamala/index.html {
    return 301 /kamala$is_args$args;
}
location = /contact {
    return 301 /kamala$is_args$args;
}
location = /contact/ {
    return 301 /kamala$is_args$args;
}
location = /contact/index.html {
    return 301 /kamala$is_args$args;
}
# Locale contact URLs keep the same slash policy as the indexed contact page.
location = /es/kamala { try_files /es/kamala/index.html =404; }
location = /calo/kamala { try_files /calo/kamala/index.html =404; }
location = /es/kamala/ { return 301 /es/kamala$is_args$args; }
location = /calo/kamala/ { return 301 /calo/kamala$is_args$args; }
