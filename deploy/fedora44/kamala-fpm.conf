; Install as /etc/php-fpm.d/kamala.conf.

[kamala]
user = nginx
group = nginx

; The socket is local and belongs to the Nginx worker account.
listen = /run/php-fpm/kamala.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 10s
pm.max_requests = 500

chdir = /var/www/kamala.pro/html
security.limit_extensions = .php
catch_workers_output = yes

; A private writable location avoids depending on another pool's session permissions.
php_admin_value[session.save_path] = /var/lib/php/kamala/session
php_admin_value[upload_tmp_dir] = /var/lib/php/kamala/tmp
php_admin_value[upload_max_filesize] = 5M
php_admin_value[post_max_size] = 16M
php_admin_value[max_file_uploads] = 3
php_admin_value[memory_limit] = 256M
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
