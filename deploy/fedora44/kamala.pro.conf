# Install as /etc/nginx/conf.d/kamala.pro.conf.

server {
    listen 80;
    listen [::]:80;
    server_name kamala.pro www.kamala.pro;

    root /var/www/kamala.pro/html;
    index index.html index.php;
    charset utf-8;
    client_max_body_size 16m;

    access_log /var/log/nginx/kamala.pro.access.log;
    error_log  /var/log/nginx/kamala.pro.error.log warn;

    # Keep certificate validation reachable before HTTPS is enabled.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # The exported site has real directories, not a single-page router.
    location / {
        try_files $uri $uri/ =404;
    }

    # PHP is required by the original biorhythm applications.
    location ~* \.php$ {
        try_files $uri =404;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php-fpm/kamala.sock;
    }

    # These extensions are not used by the application and must not expose source.
    location ~* \.(?:phtml|phar)(?:/|$) {
        return 404;
    }

    location ~ /\. {
        return 404;
    }
}
