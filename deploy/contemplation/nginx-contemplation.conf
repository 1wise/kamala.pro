# Optional: include inside the existing www.kamala.pro server block.
# The normal site root already serves this file. This exact location prevents
# upstream/browser caching and adds no filesystem, journal or API access.
location = /telemetry/contemplation.json {
    default_type application/json;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
}
